name: Sync Atlas release to Lanzou

on:
  schedule:
    - cron: "17 1 * * *"   # 兜底：每天 09:17 北京时间检查一次；平时由 account-atlas 发版即时触发
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新上传并更新链接"
        type: boolean
        default: false
  repository_dispatch:
    types: [atlas-release]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 发版即时触发时先等 3 分钟，让 Release 安装包完全就绪再同步
      - if: github.event_name == 'repository_dispatch'
        run: sleep 180
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: sync
        run: python .github/scripts/sync_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
          LANZOU_FOLDER_ID: ${{ vars.LANZOU_FOLDER_ID }}
          FORCE: ${{ inputs.force }}
      - if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atlas ${{ steps.sync.outputs.tag }}：同步蓝奏云下载链接"
          git pull --rebase origin main
          git push
          # GITHUB_TOKEN 的 push 不会触发其他工作流，这里手动触发部署
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
